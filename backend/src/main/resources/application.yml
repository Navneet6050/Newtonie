server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: newtonite-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/newtonite}
    username: ${SPRING_DATASOURCE_USERNAME:newtonite}
    password: ${SPRING_DATASOURCE_PASSWORD:newtonite}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 5000

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}
