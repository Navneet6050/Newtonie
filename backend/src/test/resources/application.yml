# Test Environment Configuration
# Directs integration tests to an isolated PostgreSQL schema ('test')
# completely separate from the active development and production 'public' schema.
server:
  port: 0

spring:
  application:
    name: newtonite-backend-test

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/newtonite?currentSchema=test}
    username: ${SPRING_DATASOURCE_USERNAME:newtonite}
    password: ${SPRING_DATASOURCE_PASSWORD:newtonite}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 5000

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: test
    create-schemas: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: test
        format_sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

cors:
  allowed-origin: http://localhost:3000

security:
  jwt:
    secret: ${JWT_SECRET:newtonite-insecure-development-jwt-secret-key-32bytes-long-for-hmac-sha256}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
