services:
  postgres:
    image: postgres:16-alpine
    container_name: newtonite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-newtonite}
      POSTGRES_USER: ${POSTGRES_USER:-newtonite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-newtonite}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-newtonite} -d ${POSTGRES_DB:-newtonite}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
    name: newtonite_postgres_data
